name: 构建与发布

# 触发规则：
#   1. push 到 main            -> 快照发布（pre-release），tag 形如 v1.0.1+snapshot.<构建次数>
#   2. push 形如 v1.2.3 的 tag  -> 正式发布，以该版本号构建；随后把仓库内版本号递增到下一 PATCH
#   3. 手动触发                 -> 按当前 package.json 版本做一次快照构建
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 创建 Release、上传资产、回推版本号提交需要 contents: write；
# 构建失败时登记诊断 Issue 需要 issues: write（缺少它 gh issue create 会被 403 拒绝，
# 而步骤又带 continue-on-error，会表现为「成功但什么都没做」）。
permissions:
  contents: write
  issues: write

# 日志带颜色便于在网页上阅读
env:
  CARGO_TERM_COLOR: always

# 不设 concurrency。
#
# 需求是「每次推送提交时自动构建并创建 Release」，而 concurrency 组与这条
# 需求根本冲突：GitHub 即使设了 cancel-in-progress: false，也会**取消同一组
# 内排队中的运行**，只保留最新一个。实测因此丢过三次发布：
#   #45、#46 被 cancel-in-progress: true 取消
#   #48 被改成 false 后仍被取消（它排在 #47 之后，属"排队中的旧运行"）
# 这三次推送都没有对应 Release。
#
# 本来也不需要并发保护：每次快照用的 tag 是 v<版本>+snapshot.<run_number>，
# run_number 在仓库内唯一，因此两次运行永远不会写同一个 Release。
# 版本号提交只在正式发布（tag 触发）时产生，而正式发布不会连续发生。

jobs:
  # ---------------------------------------------------------------- 计算版本
  prepare:
    name: 计算版本号与标签
    runs-on: ubuntu-latest
    # 只做版本号计算，正常几秒结束；设上限以免异常时长时间占用
    timeout-minutes: 5
    outputs:
      version:    ${{ steps.calc.outputs.version }}
      tag:        ${{ steps.calc.outputs.tag }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      skip:       ${{ steps.calc.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 计算
        id: calc
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"

          if [[ "$ref" == refs/tags/v* ]]; then
            tag="${ref#refs/tags/}"

            # 快照 tag 由本工作流自己创建，若被匹配到则直接跳过，避免自触发循环
            if [[ "$tag" == *"+snapshot."* ]]; then
              echo "检测到快照 tag（$tag），跳过本次构建"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # 正式版：tag 去掉前缀 v 即为程序版本号
            ver="${tag#v}"
            echo "正式发布：version=$ver"
            {
              echo "skip=false"
              echo "version=$ver"
              echo "tag=$tag"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
          else
            # 快照：版本号基数取自 package.json，构建次数用 run_number（仓库内单调递增）
            base="$(node -p "require('./package.json').version")"
            tag="v${base}+snapshot.${GITHUB_RUN_NUMBER}"
            echo "快照构建：version=$base  tag=$tag"
            {
              echo "skip=false"
              echo "version=$base"
              echo "tag=$tag"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 校验版本号格式
        if: steps.calc.outputs.skip != 'true'
        shell: bash
        run: |
          v="${{ steps.calc.outputs.version }}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 <MAJOR>.<MINOR>.<PATCH> 形式，实际为 $v"
            exit 1
          fi

  # ---------------------------------------------------------------- 前端检查
  # 只在一个平台跑一次，不放进构建矩阵。
  #
  # 原因一：这些检查与平台无关。同一份 dist 会用于全部六个平台，
  #   放进矩阵等于把同样的工作重复六遍，纯粹浪费时间。
  # 原因二：此前它们位于构建矩阵内，任何一个前端错误都会让六个平台
  #   同时失败，掩盖了「只有前端坏了、各平台后端其实还好」这一事实。
  #
  # 步骤顺序有依赖关系，不可调换：安装依赖必须排在类型检查之前。
  # 早前版本把类型检查放在前面，pnpm typecheck 找不到 vue-tsc 而必然失败，
  # 又因 continue-on-error 被掩盖成「通过」。
  frontend:
    name: 前端检查
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 不在此指定 version：package.json 已声明 packageManager，
      # 两者同时给出时 pnpm/action-setup 会直接报错退出
      # （ERR_PNPM_BAD_PM_VERSION）。版本统一由 package.json 决定，
      # 本地与 CI 因此始终一致。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装前端依赖
        # 锁文件已入库，用 frozen 确保装到的版本与本地一致；
        # 锁文件与 package.json 不一致时直接失败，而不是静默解析出别的版本
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      # 前端 invoke 的命令名或参数名与后端对不上时，Rust 侧编译照样通过，
      # 只在运行时表现为「点了按钮没反应」。界面无法在 CI 里做真实渲染测试，
      # 因此这道静态检查是拦住这类错误的主要防线。
      # 已用四种典型错误验证过它确实会失败：命令名写错、参数写成下划线、
      # 漏传必填参数、多传后端没有的参数。
      - name: 前后端命令契约检查
        run: pnpm check:ipc

      # 覆盖各功能发出的命令名与参数，以及界面挂载与主要交互流程。
      - name: 前端单元测试
        run: pnpm test

      - name: 前端构建
        # 单独构建一次：SCSS 编译、资源引用一类的错误在本步就会暴露，
        # 不必等到六个平台各失败一次才发现
        run: pnpm build

  # ---------------------------------------------------------------- 单元测试
  # 只在一个平台跑：测试验证的是与平台无关的解析、位打包与方块转换逻辑，
  # 六个平台重复执行没有额外价值，反而拖慢反馈。
  test:
    name: 单元测试
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: test

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev

      - name: 运行单元测试
        # 位打包、NBT 往返、区域索引、方块库合并等逻辑的回归防线
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture

  # ---------------------------------------------------------------- 多平台构建
  build:
    name: 构建 ${{ matrix.platform }}-${{ matrix.arch }}
    # 等前端与后端测试都通过再开始：这两项失败时各平台的打包注定失败，
    # 提前拦住可以省下六个 runner（运行 #38 里六个平台就是这样白跑一遍）
    needs: [ prepare, frontend, test ]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    # 打包含最多三次重试，每次约十余分钟；给足余量但不超过默认的 360 分钟
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest,   target: x86_64-pc-windows-msvc,    platform: windows, arch: x86_64, bundles: nsis }
          - { runner: windows-11-arm,   target: aarch64-pc-windows-msvc,   platform: windows, arch: arm64,  bundles: nsis }
          - { runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  platform: linux,   arch: x86_64, bundles: deb,appimage }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux,   arch: arm64,  bundles: deb,appimage }
          # macos-13 已被 GitHub 弃用：实测该标签的任务永远停在 queued，
          # 会连带让整个运行无法结束（日志也因此无法下载）。改用 macos-15-intel。
          - { runner: macos-15-intel,   target: x86_64-apple-darwin,      platform: macos,   arch: x86_64, bundles: dmg }
          - { runner: macos-14,         target: aarch64-apple-darwin,     platform: macos,   arch: arm64,  bundles: dmg }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf

      - name: 统一三处版本号为 ${{ needs.prepare.outputs.version }}
        # 程序内置版本号取自 Cargo.toml，安装包文件名取自 tauri.conf.json，
        # 两者与 package.json 必须一致，否则「装的版本」与「显示的版本」会对不上
        run: node scripts/bump-version.mjs ${{ needs.prepare.outputs.version }}

      - name: 环境诊断
        shell: bash
        run: |
          echo "runner=${{ matrix.runner }}  target=${{ matrix.target }}"
          node --version
          pnpm --version
          rustc --version
          cargo --version
          rustup target list --installed

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # Windows 只打 NSIS，不打 MSI。
      # 原因：项目的 productName 与版权信息是中文，WiX 的 light.exe 会报
      #   error LGHT0311: A string was provided with characters that are not
      #   available in the specified database code page
      # 即 MSI 数据库代码页无法容纳中文字符，打包阶段直接失败
      # （Rust 代码本身已编译通过）。NSIS 完整支持 Unicode，故改用 NSIS。
      # 若日后需要 MSI，可为 wix 指定 language: "zh-CN" 后再启用。
      - name: 构建（Tauri 打包）
        id: tauri
        shell: bash
        run: |
          set -o pipefail
          # 失败重试：Tauri 打包阶段需要联网下载打包工具链（如 NSIS），
          # 实测出现过 http status: 504 的瞬时失败，同一提交重跑即通过。
          # 这类基础设施抖动不应让整个发布失败。
          for attempt in 1 2 3; do
            echo "===== 构建尝试 $attempt/3  target=${{ matrix.target }} ====="
            if pnpm tauri build --target ${{ matrix.target }} \
                 --bundles ${{ matrix.bundles }} --verbose 2>&1 | tee build.log; then
              echo "构建成功（第 $attempt 次尝试）"
              exit 0
            fi
            echo "第 $attempt 次构建失败"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "三次尝试均失败"
          exit 1

      # 构建失败时把关键输出登记为 Issue。
      # 原因：GitHub 的作业日志要等整个运行结束才能下载，而并行矩阵中
      # 其它平台可能长时间占用 runner；写入 Issue 后即可随时读取，
      # 便于快速定位失败原因。
      - name: 失败时上报诊断
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          title="CI 构建失败：${{ matrix.platform }}-${{ matrix.arch }}"
          {
            echo "运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "目标: ${{ matrix.target }}  提交: ${{ github.sha }}"
            echo ""
            echo '```'
            tail -c 40000 build.log 2>/dev/null || echo "(未生成 build.log)"
            echo '```'
          } > report.md
          gh issue create --title "$title" --body-file report.md \
            --label "ci" 2>/dev/null || \
          gh issue create --title "$title" --body-file report.md

      - name: 收集并规范化产物
        run: node scripts/collect-artifacts.mjs --version ${{ needs.prepare.outputs.version }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- 发布
  release:
    name: 创建 Release
    needs: [ prepare, frontend, test, build ]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物清单
        id: assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" release-assets/
          done
          ls -1 release-assets > /dev/null
          node -e "
            const fs=require('fs');
            const names=fs.readdirSync('release-assets');
            fs.writeFileSync('assets.json', JSON.stringify(names));
            console.log('共', names.length, '个资产');
            console.log(names.join('\n'));
          "

      - name: 生成更新说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          # 资产名里用的是纯版本号，快照 tag 带 +snapshot.N 后缀不能用于匹配
          VERSION: ${{ needs.prepare.outputs.version }}
          # 快照 tag 此刻还没创建，对比必须用提交 sha；资产清单由上一步写入 assets.json
          HEAD_REF: ${{ github.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: node scripts/release-notes.mjs

      - name: 创建 / 更新 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          pre="${{ needs.prepare.outputs.prerelease }}"
          title="${{ needs.prepare.outputs.version }}"
          if [ "$pre" = "true" ]; then
            title="$title 快照构建 #${{ github.run_number }}"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --notes-file release-notes.md --title "$title"
          else
            args=(--title "$title" --notes-file release-notes.md --target "${{ github.sha }}")
            if [ "$pre" = "true" ]; then args+=(--prerelease); fi
            gh release create "$tag" release-assets/* "${args[@]}"
          fi

      # 正式发布后：把仓库内版本号 dump 到下一 PATCH
      - name: 递增版本号到下一 PATCH
        if: needs.prepare.outputs.prerelease == 'false'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/bump-version.mjs --next
          next="$(node -p "require('./package.json').version")"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore: 版本号递增到 ${next} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "已将版本号递增到 ${next}"
